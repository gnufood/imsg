[package]
name = "imsg-store"
description = "Encrypted SQLCipher message store for imsg: schema, migrations, and query layer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
formats = { package = "imsg-formats", version = "0.5.0", path = "../imsg-formats" }
rusqlite = { version = "0.37", features = ["bundled-sqlcipher"] }
# tokio-rusqlite 0.7 pins rusqlite ^0.37; versions must stay in sync
tokio-rusqlite = "0.7"
refinery = { version = "0.9", features = ["rusqlite"] }
secrecy = "0.10"
strum = "0.28"
strum_macros = "0.28"
thiserror = "2"

[dev-dependencies]
anyhow = "1"
tempfile = "3"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
