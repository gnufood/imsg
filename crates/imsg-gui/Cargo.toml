[package]
name = "imsg-gui"
description = "Tauri backend for the imsg GUI: adapter over imsg-store (local reads) and imsg-broker-client (device ops), no domain logic"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
serde     = { version = "1", features = ["derive"] }
thiserror = "2"
# Only used at the imsg-broker-client/imsg-broker API boundary (both return anyhow::Result) —
# wrapped into this crate's own thiserror enums via `#[from]`, mirroring
# `imsg-broker-client::write::WriteError`'s own `Connect(#[from] anyhow::Error)` variant.
anyhow    = "1.0.102"
# specta-macros is a direct dep purely to force its `serde` feature on via unification with
# specta's own (unconfigured) transitive pull — mirrors imsg-ipc's rationale for the same pin.
# "function" (on specta) is required for the `#[specta::specta]` attribute used on
# `#[tauri::command]` handlers in `commands.rs`.
specta        = { version = "2.0.0-rc.25", features = ["derive", "function"] }
specta-macros = { version = "=2.0.0-rc.25", features = ["serde"] }
# tauri's "specta" feature adds `FunctionArg` impls for `State`/`AppHandle`/etc. so they're
# excluded from exported command signatures instead of failing to compile.
tauri         = { version = "2.11.5", features = ["specta"] }
tauri-specta  = { version = "2.0.0-rc.25", features = ["typescript"] }
# Pinned to the exact version tauri-specta 2.0.0-rc.25 itself depends on (its "typescript"
# feature above already pulls this in transitively) — declared directly since
# `examples/export_bindings.rs` names `specta_typescript::Typescript` itself.
specta-typescript = "0.0.12"
config        = { package = "imsg-config",  version = "0.3.1", path = "../imsg-config" }
keyring       = { package = "imsg-keyring", version = "0.3.1", path = "../imsg-keyring" }
store         = { package = "imsg-store",   version = "0.3.1", path = "../imsg-store" }
service       = { package = "imsg-service", version = "0.3.1", path = "../imsg-service" }
broker-client = { package = "imsg-broker-client", version = "0.3.1", path = "../imsg-broker-client" }
# The daemon runtime itself (`run_daemon`) — needed for self-provisioning's headless mode,
# which runs the broker in-process rather than talking to one over IPC like every other
# imsg-gui command. See `daemon/provision.rs`.
imsg-broker   = { version = "0.3.1", path = "../imsg-broker" }
ipc           = { package = "imsg-ipc", version = "0.3.1", path = "../imsg-ipc", features = ["specta"] }
# `respawn_self` — the headless-child spawn/log-redirect mechanics `daemon/provision.rs` shares
# with the CLI's own two spawn sites.
imsg-proc     = { version = "0.3.1", path = "../imsg-proc" }
# `discover::{list_paired_devices, resolve_channels}` — the device-config gate's data source.
transport     = { package = "imsg-transport", version = "0.3.1", path = "../imsg-transport" }
# `watch`/`Notify` for the startup gate's status/proceed signalling (`gate.rs`); `time` for
# the headless child's connected-announcement poll (`daemon/provision.rs`).
tokio         = { version = "1.52.3", features = ["sync", "time"] }
tracing       = "0.1.44"
# `main.rs` only: same subscriber setup as the CLI's `init_tracing`, so the headless daemon
# child's tracing output reaches its captured log file.
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
tauri-build = "2.6.3"

[dev-dependencies]
secrecy      = "0.10"
tempfile     = "3"
tokio        = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
# Additive feature on the same `tauri` dependency (Cargo unifies it in for `cargo test` only) —
# `tauri::test`'s `mock_app`/`MockRuntime` harness for exercising `commands.rs` with no mocks.
tauri        = { version = "2.11.5", features = ["test"] }
figment      = { version = "0.10.19", features = ["test"] }
serial_test  = "3"
bytes        = "1"
futures      = "0.3"
interprocess = { version = "2.4.2", features = ["tokio"] }
tokio-util   = { version = "0.7.18", features = ["codec"] }
serde_json   = "1.0.150"
# `cargo tauri icon` — generates the Linux icon set from assets/imsg.png.
tauri-cli    = "2.11.4"

[lints]
workspace = true
