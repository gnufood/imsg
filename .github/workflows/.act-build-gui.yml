# Scratch file for local `act` testing of the `build-gui` job in isolation — deliberately
# excludes `plan`/`host`/`upload-r2`/`announce` so there is no code path here that can touch
# a real GitHub Release or the R2 bucket. Not part of the real pipeline; delete after testing.
name: act-build-gui-test

on:
  workflow_dispatch:

jobs:
  build-gui:
    runs-on: "ubuntu-22.04"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libbluetooth-dev libwebkit2gtk-4.1-dev \
            build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev
      - run: npm ci --prefix crates/imsg-gui/frontend
      - run: cargo run --example export_bindings -p imsg-gui
      - uses: tauri-apps/tauri-action@v1
        with:
          projectPath: crates/imsg-gui
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: 'artifacts-gui-[bundle]'
